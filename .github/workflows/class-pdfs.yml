# Rebuilds the two class PDFs whenever the slides change on a branch that GitHub Pages serves, and commits them back:
#   slides/machine_learning_class_ppt.pdf
#   slides/neural_networks_class_ppt.pdf
# The builder is tools/make-handouts.mjs (the same command works on a laptop: see its header).
name: Class PDFs

on:
  push:
    branches: [feature/new-slides, main]
    paths:
      - 'slides/**'
      - '!slides/*_class_ppt.pdf'
      - 'tools/make-handouts.mjs'
      - 'tools/package.json'
      - 'tools/package-lock.json'
      - '.github/workflows/class-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write   # commit the PDFs back to the branch
  pages: write      # ask GitHub Pages to rebuild afterwards

concurrency:
  group: class-pdfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json

      # The slides are set in Calibri; Carlito has the same metrics, so lines wrap the same way as on the author's machine.
      - name: Fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-crosextra-carlito

      - name: Install the PDF builder
        run: npm ci
        working-directory: tools

      - name: Build the class PDFs
        run: node tools/make-handouts.mjs   # picks up the runner's google-chrome

      - name: Commit the PDFs
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slides/machine_learning_class_ppt.pdf slides/neural_networks_class_ppt.pdf
          if git diff --cached --quiet; then
            echo "PDFs unchanged, nothing to commit"
          else
            git commit -m "chore: rebuild class PDFs"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN does not start the Pages build by itself, so request it.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
