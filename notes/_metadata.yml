# Shared by every note in notes/: the slide figure engine and its styles (paths are relative to the
# rendered page, notes/<part>/<note>.html). Each note adds its own topic file, fig-<topic>.js, in its header.
format:
  html:
    include-in-header:
      - text: |
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
          <link rel="stylesheet" href="../assets/notes.css">
    include-after-body:
      - text: |
          <script src="../../slides/assets/figures.js"></script>
          <script src="../assets/notes-widgets.js"></script>
